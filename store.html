<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHER // Sneaker Archive & Studio Store</title>
  <style>
    :root {
      --bg-dark: #090a0d;
      --bg-studio: radial-gradient(circle at 50% 42%, #1d1f27 0%, #090a0d 78%);
      --panel-bg: rgba(17, 19, 25, 0.84);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.28);
      --text-main: #f4f4f6;
      --text-muted: #9498a6;
      --accent: #ff6b2b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-dark);
      background-image: var(--bg-studio);
      color: var(--text-main);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Ambient Studio Floor Light */
    .studio-glow {
      position: fixed;
      bottom: -140px;
      left: 50%;
      transform: translateX(-50%);
      width: 780px;
      height: 320px;
      background: radial-gradient(ellipse at center, rgba(255, 115, 45, 0.22) 0%, rgba(255, 115, 45, 0) 72%);
      pointer-events: none;
      z-index: 0;
      transition: background 0.5s ease;
    }

    /* Top Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 72px;
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 25;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: linear-gradient(135deg, #ffffff 0%, #8e929f 100%);
      color: #090a0d;
      font-weight: 900;
      font-size: 0.85rem;
      display: grid;
      place-items: center;
    }

    .brand-name {
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .nav-pills {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(14px);
      padding: 5px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
    }

    .nav-pill {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .nav-pill.active,
    .nav-pill:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .cart-trigger {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.2s ease;
    }

    .cart-trigger:hover {
      border-color: var(--border-hover);
    }

    .cart-badge {
      background: var(--accent);
      color: #090a0d;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.72rem;
    }

    /* Main Showcase Stage */
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      padding: 80px 48px 60px;
    }

    /* Grid View of Grouped Sneaker Models */
    .showcase-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(260px, 340px));
      gap: 42px;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .showcase-grid.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
    }

    .shoe-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 24px 18px 18px;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Hover Animation on Pointer Over */
    .shoe-card:hover {
      transform: translateY(-14px);
    }

    .shoe-visual-wrap {
      position: relative;
      width: 100%;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .shoe-card:hover .shoe-visual-wrap {
      transform: translateY(-10px) scale(1.07) rotate(-3deg);
    }

    .shoe-img {
      max-width: 92%;
      max-height: 205px;
      object-fit: contain;
      border-radius: 16px;
      transition: filter 0.35s ease;
    }

    /* Studio Glass Pedestal Bar (Replaces Box Shadow Below Shoes) */
    .glass-pedestal {
      position: relative;
      width: 84%;
      height: 18px;
      margin-top: 8px;
      border-radius: 6px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.24) 0%,
        rgba(255, 255, 255, 0.06) 55%,
        rgba(255, 255, 255, 0.14) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(8px);
      overflow: hidden;
      transition: transform 0.4s ease, border-color 0.4s ease;
    }

    .glass-pedestal::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, var(--pedestal-glow, rgba(255, 107, 43, 0.55)), transparent);
      opacity: 0.45;
      transition: opacity 0.35s ease;
    }

    .shoe-card:hover .glass-pedestal {
      border-color: rgba(255, 255, 255, 0.45);
      transform: scaleX(1.04);
    }

    .shoe-card:hover .glass-pedestal::after {
      opacity: 0.95;
    }

    /* Card Label & Color Count Pill */
    .card-meta {
      margin-top: 16px;
      text-align: center;
      transition: transform 0.35s ease;
    }

    .card-series {
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      margin-top: 3px;
      text-transform: uppercase;
    }

    .card-sub {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      padding: 4px 12px;
      border-radius: 999px;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .shoe-card:hover .card-sub {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .mini-dots {
      display: inline-flex;
      gap: 4px;
    }

    .mini-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* Detail Inspection View */
    .detail-stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      z-index: 12;
      transition: opacity 0.45s ease;
    }

    .detail-stage.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Left Title & Back Button */
    .detail-left {
      position: fixed;
      top: 98px;
      left: 38px;
      z-index: 20;
      transform: translateX(-24px);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .detail-stage.active .detail-left {
      transform: translateX(0);
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--border-hover);
    }

    .det-series {
      font-size: 0.74rem;
      letter-spacing: 2.4px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .det-title {
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1.05;
      margin-top: 6px;
      text-transform: uppercase;
    }

    .det-desc {
      margin-top: 12px;
      font-size: 0.86rem;
      color: var(--text-muted);
      max-width: 290px;
      line-height: 1.55;
    }

    /* Center Hero Sneaker + Pedestal */
    .hero-showcase {
      position: relative;
      width: 480px;
      margin-right: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      perspective: 1000px;
    }

    .hero-img-wrap {
      width: 100%;
      height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease-out;
      animation: floatShoe 4s ease-in-out infinite;
    }

    @keyframes floatShoe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .hero-img {
      max-width: 95%;
      max-height: 320px;
      object-fit: contain;
      border-radius: 22px;
      transition: opacity 0.28s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-img.switching {
      opacity: 0;
      transform: scale(0.93) translateY(8px);
    }

    .hero-pedestal {
      width: 82%;
      height: 22px;
      margin-top: 10px;
      border-radius: 8px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.28) 0%,
        rgba(255, 255, 255, 0.06) 55%,
        rgba(255, 255, 255, 0.16) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.26);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .hero-pedestal::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, var(--active-glow, rgba(255, 107, 43, 0.75)), transparent);
    }

    /* Right Side Info, Colorway & Ordering Panel */
    .inspector-panel {
      position: fixed;
      top: 86px;
      right: 30px;
      bottom: 30px;
      width: 355px;
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 24px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform: translateX(40px);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
    }

    .detail-stage.active .inspector-panel {
      transform: translateX(0);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .panel-price {
      font-size: 1.7rem;
      font-weight: 800;
    }

    .stock-badge {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #34d399;
      background: rgba(52, 211, 153, 0.12);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .section-block {
      margin-top: 18px;
    }

    .section-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .section-label span {
      color: var(--text-main);
    }

    /* Colorway Thumbnail + Swatch Selector */
    .color-options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .color-card-btn {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--border-subtle);
      padding: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .color-card-btn:hover {
      transform: translateY(-3px);
      border-color: var(--border-hover);
    }

    .color-card-btn.active {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
    }

    .color-card-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 7px;
    }

    /* Technical Properties Grid */
    .props-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .prop-card {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .prop-key {
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .prop-val {
      font-size: 0.84rem;
      font-weight: 700;
      margin-top: 3px;
    }

    /* Size Selector */
    .size-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .size-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 9px 0;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .size-btn:hover {
      border-color: var(--border-hover);
      background: rgba(255, 255, 255, 0.09);
    }

    .size-btn.active {
      background: #ffffff;
      color: #090a0d;
      border-color: #ffffff;
      font-weight: 800;
    }

    /* Quantity & Order Button */
    .order-controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .qty-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0 6px;
    }

    .qty-btn {
      background: none;
      border: none;
      color: var(--text-main);
      width: 28px;
      height: 44px;
      font-size: 1rem;
      cursor: pointer;
    }

    .qty-val {
      width: 24px;
      text-align: center;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .add-order-btn {
      flex: 1;
      background: #ffffff;
      color: #090a0d;
      border: none;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .add-order-btn:hover {
      background: #e4e4e7;
    }

    .add-order-btn:active {
      transform: scale(0.97);
    }

    /* Slide-out Order Bag */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 370px;
      background: rgba(13, 14, 19, 0.97);
      backdrop-filter: blur(24px);
      border-left: 1px solid var(--border-subtle);
      z-index: 40;
      padding: 28px;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cart-drawer.open {
      transform: translateX(0);
    }

    .cart-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cart-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cart-item img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 8px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-info h4 {
      font-size: 0.86rem;
      font-weight: 700;
    }

    .cart-item-info p {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 16px 0;
      border-top: 1px solid var(--border-subtle);
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translate(-50%, 20px);
      background: #10b981;
      color: #052e16;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 10px 20px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 1024px) {
      .showcase-grid {
        grid-template-columns: repeat(2, minmax(220px, 300px));
        gap: 24px;
      }
      .hero-showcase {
        margin-right: 340px;
        width: 340px;
      }
    }
  </style>
</head>
<body>

  <div class="studio-glow" id="studio-glow"></div>

  <header>
    <div class="brand" id="logo-reset">
      <div class="brand-mark">AE</div>
      <div class="brand-name">AETHER STUDIO</div>
    </div>

    <div class="nav-pills" id="filter-pills">
      <button class="nav-pill active" data-filter="all">All Models (3)</button>
      <button class="nav-pill" data-filter="jordan">Jordan Series</button>
      <button class="nav-pill" data-filter="kyrie">Kyrie Series</button>
    </div>

    <button class="cart-trigger" id="open-cart">
      BAG <span class="cart-badge" id="cart-count">0</span>
    </button>
  </header>

  <!-- Main Grid View (Shows Only 1 Hero Shoe per Model Family) -->
  <main class="stage">
    <div class="showcase-grid" id="showcase-grid"></div>
  </main>

  <!-- Detail Inspection & Color Switcher Stage -->
  <section class="detail-stage" id="detail-stage">
    <div class="detail-left">
      <button class="back-btn" id="btn-back">&larr; Back to Archive</button>
      <div class="det-series" id="det-series">JORDAN ARCHIVE // 01</div>
      <h1 class="det-title" id="det-title">AIR JORDAN 1</h1>
      <p class="det-desc" id="det-desc"></p>
    </div>

    <div class="hero-showcase" id="hero-showcase">
      <div class="hero-img-wrap" id="hero-img-wrap">
        <img src="" alt="Selected Sneaker" class="hero-img" id="hero-img" />
      </div>
      <div class="hero-pedestal" id="hero-pedestal"></div>
    </div>

    <!-- Right Side Info, Available Colorways & Ordering -->
    <aside class="inspector-panel">
      <div>
        <div class="panel-header">
          <div class="panel-price" id="det-price">$220</div>
          <div class="stock-badge" id="det-stock">In Stock &bull; 12 Left</div>
        </div>

        <div class="section-block">
          <div class="section-label">
            Available Colors (<span id="color-count">3</span>)
            <span id="active-color-name">Patent Bred</span>
          </div>
          <div class="color-options" id="color-options"></div>
        </div>

        <div class="section-block">
          <div class="section-label">Properties &amp; Specs</div>
          <div class="props-grid" id="props-grid"></div>
        </div>

        <div class="section-block">
          <div class="section-label">Select Size (US) <span>True to Size</span></div>
          <div class="size-grid" id="size-grid"></div>
        </div>
      </div>

      <div class="order-controls">
        <div class="qty-box">
          <button class="qty-btn" id="qty-minus">&minus;</button>
          <span class="qty-val" id="qty-val">1</span>
          <button class="qty-btn" id="qty-plus">+</button>
        </div>
        <button class="add-order-btn" id="btn-add-bag">Order Now &bull; $220</button>
      </div>
    </aside>
  </section>

  <!-- Slide-out Bag Drawer -->
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-head">
      <strong style="letter-spacing: 1.5px; font-size: 0.85rem;">YOUR ORDER BAG</strong>
      <button class="back-btn" style="margin:0; padding:5px 10px;" id="close-cart">Close</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div>
      <div class="cart-total-row">
        <span>Total</span>
        <span id="cart-total">$0</span>
      </div>
      <button class="add-order-btn" style="width:100%; height:46px;" id="btn-checkout">
        Complete Order
      </button>
    </div>
  </div>

  <div class="toast" id="toast">Added to your bag</div>

  <script>
    // Grouped Sneaker Catalog using your exact uploaded image filenames
    const CATALOG = [
      {
        id: 'air-jordan-1',
        family: 'jordan',
        series: 'HERITAGE ARCHIVE // 01',
        name: 'AIR JORDAN 1',
        price: 220,
        stock: 11,
        desc: 'Iconic high-top basketball silhouette crafted with glossy patent and full-grain leather overlays and Air-Sole heel cushioning.',
        props: {
          Upper: 'Patent & Leather',
          Cushion: 'Air-Sole Unit',
          Collar: 'High-Top',
          Outsole: 'Pivot Rubber'
        },
        variants: [
          { name: 'Patent Bred', file: 'jordan 1.webp', swatch: '#dc2626', glow: 'rgba(220, 38, 38, 0.7)' },
          { name: 'Pollen Gold', file: 'jordan 2.webp', swatch: '#eab308', glow: 'rgba(234, 179, 8, 0.7)' },
          { name: 'Bred Toe', file: 'jordan 3.webp', swatch: '#991b1b', glow: 'rgba(239, 68, 68, 0.65)' }
        ]
      },
      {
        id: 'air-jordan-4',
        family: 'jordan',
        series: 'FLIGHT SERIES // 04',
        name: 'AIR JORDAN 4',
        price: 260,
        stock: 8,
        desc: 'Tinker Hatfield flight design featuring breathable mesh netting, molded support wings, and visible Air heel cushioning.',
        props: {
          Upper: 'Suede & Nubuck',
          Cushion: 'Visible Air',
          Support: 'TPU Wing Cage',
          Weight: '410 g'
        },
        variants: [
          { name: 'Fire Red', file: 'jordan new 1.jpg', swatch: '#dc2626', glow: 'rgba(220, 38, 38, 0.7)' },
          { name: 'University Blue', file: 'jordan new 2.webp', swatch: '#60a5fa', glow: 'rgba(96, 165, 250, 0.75)' },
          { name: 'White Thunder', file: 'jordan new 3.webp', swatch: '#18181b', glow: 'rgba(226, 232, 240, 0.6)' },
          { name: 'Orchid Pink', file: 'jordan new 4.webp', swatch: '#d882a8', glow: 'rgba(216, 130, 168, 0.75)' },
          { name: 'Shimmer Sand', file: 'jordan new 5.webp', swatch: '#d6b49c', glow: 'rgba(214, 180, 156, 0.7)' }
        ]
      },
      {
        id: 'kyrie-7',
        family: 'kyrie',
        series: 'COURT VELOCITY // 07',
        name: 'KYRIE 7',
        price: 185,
        stock: 15,
        desc: 'Built for rapid directional cuts with articulated forefoot Zoom Turbo cushioning, composite mesh, and locked-in forefoot fins.',
        props: {
          Upper: 'Composite Mesh',
          Cushion: 'Zoom Turbo',
          Traction: '360° Data Grip',
          Weight: '345 g'
        },
        variants: [
          { name: 'Royal Blue', file: 'kyire 2.webp', swatch: '#1d4ed8', glow: 'rgba(37, 99, 235, 0.75)' },
          { name: 'University Red', file: 'kyire 4.webp', swatch: '#dc2626', glow: 'rgba(220, 38, 38, 0.75)' }
        ]
      }
    ];

    let activeModel = null;
    let activeVariantIndex = 0;
    let selectedSize = 'US 9.5';
    let quantity = 1;
    const cart = [];

    const gridEl = document.getElementById('showcase-grid');
    const detailStage = document.getElementById('detail-stage');
    const studioGlow = document.getElementById('studio-glow');
    const heroImg = document.getElementById('hero-img');
    const heroImgWrap = document.getElementById('hero-img-wrap');
    const heroPedestal = document.getElementById('hero-pedestal');

    // Render Main Grid (One Hero Shoe per Model)
    function renderGrid(filter = 'all') {
      gridEl.innerHTML = '';
      const filtered = filter === 'all' ? CATALOG : CATALOG.filter((item) => item.family === filter);

      filtered.forEach((model) => {
        const heroVariant = model.variants[0];
        const card = document.createElement('div');
        card.className = 'shoe-card';
        card.style.setProperty('--pedestal-glow', heroVariant.glow);

        const dotsHtml = model.variants
          .map((v) => `<span class="mini-dot" style="background:${v.swatch};"></span>`)
          .join('');

        card.innerHTML = `
          <div class="shoe-visual-wrap">
            <img src="${heroVariant.file}" alt="${model.name}" class="shoe-img" />
          </div>
          <div class="glass-pedestal"></div>
          <div class="card-meta">
            <div class="card-series">${model.series}</div>
            <div class="card-title">${model.name}</div>
            <div class="card-sub">
              <span>$${model.price}</span>
              <span>&bull;</span>
              <span class="mini-dots">${dotsHtml}</span>
              <span>${model.variants.length} Colors</span>
            </div>
          </div>
        `;

        card.addEventListener('mouseenter', () => {
          studioGlow.style.background = `radial-gradient(ellipse at center, ${heroVariant.glow.replace('0.7', '0.26')} 0%, rgba(0,0,0,0) 72%)`;
        });

        card.addEventListener('click', () => openDetail(model));
        gridEl.appendChild(card);
      });
    }

    // Switch Colorway inside Detail View
    function selectVariant(idx) {
      activeVariantIndex = idx;
      const variant = activeModel.variants[idx];

      document.getElementById('active-color-name').textContent = variant.name;
      document.querySelectorAll('.color-card-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });

      heroPedestal.style.setProperty('--active-glow', variant.glow);
      studioGlow.style.background = `radial-gradient(ellipse at center, ${variant.glow.replace('0.7', '0.28')} 0%, rgba(0,0,0,0) 72%)`;

      heroImg.classList.add('switching');
      setTimeout(() => {
        heroImg.src = variant.file;
        heroImg.classList.remove('switching');
      }, 150);
    }

    // Open Detail View for Selected Model
    function openDetail(model) {
      activeModel = model;
      activeVariantIndex = 0;
      quantity = 1;
      document.getElementById('qty-val').textContent = '1';

      document.getElementById('det-series').textContent = model.series;
      document.getElementById('det-title').textContent = model.name;
      document.getElementById('det-desc').textContent = model.desc;
      document.getElementById('det-price').textContent = `$${model.price}`;
      document.getElementById('det-stock').textContent = `In Stock • ${model.stock} Left`;
      document.getElementById('color-count').textContent = model.variants.length;
      document.getElementById('btn-add-bag').textContent = `Order Now • $${model.price}`;

      // Render Colorway Thumbnails (shows jordan 1, 2, 3 etc. when clicked)
      const colorOptionsEl = document.getElementById('color-options');
      colorOptionsEl.innerHTML = '';
      model.variants.forEach((v, idx) => {
        const btn = document.createElement('button');
        btn.className = `color-card-btn ${idx === 0 ? 'active' : ''}`;
        btn.title = v.name;
        btn.innerHTML = `<img src="${v.file}" alt="${v.name}" />`;
        btn.addEventListener('click', () => selectVariant(idx));
        colorOptionsEl.appendChild(btn);
      });

      // Render Technical Properties
      const propsGrid = document.getElementById('props-grid');
      propsGrid.innerHTML = '';
      Object.entries(model.props).forEach(([k, v]) => {
        const div = document.createElement('div');
        div.className = 'prop-card';
        div.innerHTML = `<div class="prop-key">${k}</div><div class="prop-val">${v}</div>`;
        propsGrid.appendChild(div);
      });

      // Render Sizes
      const sizes = ['US 7', 'US 8', 'US 8.5', 'US 9', 'US 9.5', 'US 10', 'US 11', 'US 12'];
      const sizeGrid = document.getElementById('size-grid');
      sizeGrid.innerHTML = '';
      sizes.forEach((sz) => {
        const btn = document.createElement('button');
        btn.className = `size-btn ${sz === selectedSize ? 'active' : ''}`;
        btn.textContent = sz;
        btn.addEventListener('click', () => {
          selectedSize = sz;
          document.querySelectorAll('.size-btn').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
        });
        sizeGrid.appendChild(btn);
      });

      heroImg.src = model.variants[0].file;
      selectVariant(0);

      gridEl.classList.add('hidden');
      detailStage.classList.add('active');
    }

    function closeDetail() {
      activeModel = null;
      detailStage.classList.remove('active');
      gridEl.classList.remove('hidden');
      studioGlow.style.background = 'radial-gradient(ellipse at center, rgba(255, 115, 45, 0.22) 0%, rgba(255, 115, 45, 0) 72%)';
    }

    // Subtle Interactive Tilt when Moving Pointer over Hero Shoe
    const heroShowcase = document.getElementById('hero-showcase');
    heroShowcase.addEventListener('mousemove', (e) => {
      const rect = heroShowcase.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width - 0.5) * 16;
      const y = ((e.clientY - rect.top) / rect.height - 0.5) * -12;
      heroImgWrap.style.transform = `rotateY(${x}deg) rotateX(${y}deg) scale(1.04)`;
    });

    heroShowcase.addEventListener('mouseleave', () => {
      heroImgWrap.style.transform = 'rotateY(0deg) rotateX(0deg) scale(1)';
    });

    // Navigation & Filter Controls
    document.getElementById('btn-back').addEventListener('click', closeDetail);
    document.getElementById('logo-reset').addEventListener('click', closeDetail);

    document.querySelectorAll('.nav-pill').forEach((pill) => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.nav-pill').forEach((p) => p.classList.remove('active'));
        pill.classList.add('active');
        if (activeModel) closeDetail();
        renderGrid(pill.dataset.filter);
      });
    });

    // Quantity Controls
    document.getElementById('qty-minus').addEventListener('click', () => {
      if (quantity > 1 && activeModel) {
        quantity--;
        document.getElementById('qty-val').textContent = quantity;
        document.getElementById('btn-add-bag').textContent = `Order Now • $${activeModel.price * quantity}`;
      }
    });

    document.getElementById('qty-plus').addEventListener('click', () => {
      if (quantity < 10 && activeModel) {
        quantity++;
        document.getElementById('qty-val').textContent = quantity;
        document.getElementById('btn-add-bag').textContent = `Order Now • $${activeModel.price * quantity}`;
      }
    });

    // Cart Drawer & Ordering
    const cartDrawer = document.getElementById('cart-drawer');
    const cartItemsEl = document.getElementById('cart-items');
    const toastEl = document.getElementById('toast');

    function renderCart() {
      const count = cart.reduce((acc, item) => acc + item.qty, 0);
      const total = cart.reduce((acc, item) => acc + item.price * item.qty, 0);
      document.getElementById('cart-count').textContent = count;
      document.getElementById('cart-total').textContent = `$${total}`;

      if (cart.length === 0) {
        cartItemsEl.innerHTML = `<p style="color: var(--text-muted); font-size: 0.82rem; text-align:center; margin-top:40px;">Your bag is empty.</p>`;
        return;
      }

      cartItemsEl.innerHTML = '';
      cart.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'cart-item';
        row.innerHTML = `
          <img src="${item.file}" alt="${item.name}" />
          <div class="cart-item-info">
            <h4>${item.name} &times; ${item.qty}</h4>
            <p>${item.color} &bull; ${item.size}</p>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:700; font-size:0.9rem;">$${item.price * item.qty}</div>
            <button data-rm="${idx}" style="background:none; border:none; color:#f87171; font-size:0.7rem; cursor:pointer; margin-top:4px;">Remove</button>
          </div>
        `;
        cartItemsEl.appendChild(row);
      });

      cartItemsEl.querySelectorAll('[data-rm]').forEach((btn) => {
        btn.addEventListener('click', () => {
          cart.splice(Number(btn.dataset.rm), 1);
          renderCart();
        });
      });
    }

    document.getElementById('btn-add-bag').addEventListener('click', () => {
      if (!activeModel) return;
      const variant = activeModel.variants[activeVariantIndex];
      cart.push({
        name: activeModel.name,
        color: variant.name,
        file: variant.file,
        size: selectedSize,
        qty: quantity,
        price: activeModel.price
      });
      renderCart();

      toastEl.textContent = `Added ${activeModel.name} (${variant.name}, ${selectedSize})`;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2400);
    });

    document.getElementById('open-cart').addEventListener('click', () => cartDrawer.classList.add('open'));
    document.getElementById('close-cart').addEventListener('click', () => cartDrawer.classList.remove('open'));
    document.getElementById('btn-checkout').addEventListener('click', () => {
      if (cart.length === 0) return;
      cart.length = 0;
      renderCart();
      cartDrawer.classList.remove('open');
      toastEl.textContent = 'Order placed! Thank you for shopping AETHER Studio.';
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 3000);
    });

    // Initialize
    renderGrid('all');
    renderCart();
  </script>
</body>
</html>
